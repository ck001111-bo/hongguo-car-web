<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#131215"><title>红果放映室</title><link rel="stylesheet" href="/style.css"></head><body>
<div id="login" class="login"><form id="login-form" method="post"><span class="logo">果</span><p class="eyebrow">你的私人放映室</p><h1>好剧，接着看。</h1><p class="muted">输入访问密码，打开你的短剧片单。</p><label for="password">访问密码</label><input id="password" type="password" required autocomplete="current-password" placeholder="输入密码"><button class="primary" type="submit" disabled>进入放映室 <span>↗</span></button><p id="login-error" role="alert"></p></form></div>
<div id="app" hidden><header><a class="brand" href="/"><span class="logo">果</span>红果放映室 <small>WEB</small></a><div class="header-actions"><button id="car-mode" class="quiet" aria-pressed="false">大屏模式</button><button id="logout" class="quiet">退出</button></div></header>
<main><section class="hero"><div><p class="eyebrow">私人放映室 · 测试版</p><h1>把故事，<br>留给这一刻。</h1><p class="muted">浏览器打开就能看，首次播放新集数需要稍等。</p></div><div class="hero-art" aria-hidden="true"><span>▶</span><i>今晚的故事<br>现在开场</i></div></section>
<div class="toolbar"><nav><button id="discover" class="tab active">发现</button><button id="history" class="tab">最近看过</button></nav><form id="search-form"><input id="query" maxlength="80" placeholder="搜索你想看的剧…" aria-label="搜索剧名"><button type="submit" aria-label="搜索">搜索</button></form></div>
<div class="section-title"><h2 id="list-title">今日片单</h2><span id="count" class="muted"></span></div><p id="status" class="status" role="status"></p><section id="cards" class="cards"></section><button id="more" class="more" hidden>再看一些 ↓</button>
<footer>非官方私人客户端 · 片源可用性取决于内容平台 · 不以预览片代替完整剧集</footer></main></div>
<dialog id="player-dialog"><div class="player-top"><div><span class="eyebrow">正在放映</span><h2 id="player-title"></h2></div><button id="close-player" aria-label="关闭播放器">✕</button></div><div class="watch-layout"><div class="screen"><video id="video" controls playsinline preload="metadata"></video><p id="play-status" role="status"></p><div class="play-controls"><button id="toggle-play">播放 / 暂停</button><button id="previous">← 上一集</button><label><input type="checkbox" id="autoplay" checked> 自动连播</label><button id="next">下一集 →</button><button id="fullscreen">全屏</button></div></div><aside><div class="episode-heading"><h3>选集</h3><span id="episode-count" class="muted"></span></div><div id="episodes" class="episodes"></div></aside></div><p id="description" class="description"></p></dialog><script src="/hls.min.js"></script><script src="/app.js" type="module"></script></body></html>
